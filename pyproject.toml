[project]
name = "ai-sdlc-pipeline"
version = "0.1.0"
description = "AI SDLC pipeline: Jira ticket to reviewed, deploy-documented GitLab MRs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12",
    "apscheduler>=3.11.3,<4",
    "atlassian-python-api>=5.0.5",
    "claude-agent-sdk>=0.2.160",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "httpx>=0.28.1",
    "jsonschema>=4.23",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "markdownify>=1.2.3",
    "prompt-toolkit>=3.0.53",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-gitlab>=8.5.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.1",
    "structlog>=26.1.0",
    "typer>=0.27.2",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
